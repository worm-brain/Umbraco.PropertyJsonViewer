# CodeQL configuration for the Security workflow (.github/workflows/security.yml).
#
# Only code that ships is reported. For C#, paths-ignore filters results after the analysis; for
# TypeScript, the files are left out of the analysis altogether.
name: "CodeQL config"

paths-ignore:
  # Developer tooling that never ships: the Playwright suite and the client's build scripts run only
  # against the local sample sites, whose development certificate they deliberately do not verify.
  - "src/*/Client/e2e/**"
  - "src/*/Client/scripts/**"
